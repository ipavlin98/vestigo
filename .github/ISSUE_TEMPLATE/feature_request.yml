name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution. "I often need to find the file I saved a minute ago and…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Vestigo help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
